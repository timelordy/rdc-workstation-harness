name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets (gitleaks)
        shell: pwsh
        run: |
          # Pinned version and SHA-256 (from the release's checksums.txt).
          $v = "8.30.1"
          $sha256 = "PINNED_SHA256"
          $zip = "gitleaks_${v}_windows_x64.zip"
          Invoke-WebRequest "https://github.com/gitleaks/gitleaks/releases/download/v$v/$zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) { throw "gitleaks checksum mismatch" }
          Expand-Archive $zip gitleaks-bin
          ./gitleaks-bin/gitleaks.exe git --no-banner --redact --log-opts="--all" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            src/browser_bridge/package-lock.json
            src/desktop_agent/mcp/package-lock.json
      - name: Validate Python syntax
        run: python -m compileall -q src tools tests
      - name: Lint Python (undefined names, unused imports)
        run: |
          python -m pip install --disable-pip-version-check pyflakes==3.4.0
          python -m pyflakes src tools tests
      - name: Install desktop agent runtime for behaviour tests
        run: python -m pip install --disable-pip-version-check -r src/desktop_agent/requirements.txt
      - name: Validate Node syntax
        shell: pwsh
        run: |
          node --check src/browser_bridge/bridge.js
          node --check src/desktop_agent/mcp/server.mjs
          node --check tools/rdc_share_hook.mjs
      - name: Run Node tests
        run: node --test tests/share_hook.test.mjs
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Verify browser lockfile
        working-directory: src/browser_bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify MCP lockfile
        working-directory: src/desktop_agent/mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
